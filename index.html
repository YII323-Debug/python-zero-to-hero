<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 闯关岛 · 零基础学编程</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <svg class="mascot" viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
        <rect x="16" y="3" width="4" height="13" rx="2" fill="#3f8cff"/>
        <rect x="44" y="3" width="4" height="13" rx="2" fill="#3f8cff"/>
        <circle cx="18" cy="4" r="4" fill="#ff9f43"/>
        <circle cx="46" cy="4" r="4" fill="#ff9f43"/>
        <rect x="7" y="13" width="50" height="41" rx="12" fill="#3f8cff"/>
        <rect x="14" y="25" width="36" height="22" rx="7" fill="#eaf3ff"/>
        <circle cx="26" cy="36" r="4.3" fill="#243b53"/>
        <circle cx="38" cy="36" r="4.3" fill="#243b53"/>
        <path d="M26 44 Q32 49 38 44" stroke="#243b53" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <rect x="20" y="58" width="24" height="4" rx="2" fill="#d7e4f7"/>
      </svg>
      <div class="brand-text">
        <h1>Python 闯关岛</h1>
        <p>从零开始，一关一关学会编程</p>
      </div>
    </div>

    <div class="top-progress">
      <div class="progress-label">
        <span id="progressText">第 1 关 · 共 11 关</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="top-actions">
      <span class="save-status" id="saveStatus" title="进度保存状态">
        <span class="save-dot"></span><span id="saveStatusText">进度会自动保存</span>
      </span>
      <button class="save-btn" id="saveBtn" type="button" title="立即保存当前进度">保存进度</button>
      <button class="reset-btn" id="resetBtn" type="button" title="清空进度重新开始">重新开始</button>
    </div>
  </header>

  <div class="layout">

    <!-- 左侧关卡地图 -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z" fill="none" stroke="#3f8cff" stroke-width="2" stroke-linejoin="round"/><path d="M9 3v15M15 6v15" stroke="#3f8cff" stroke-width="2"/></svg>
        <h2>关卡地图</h2>
      </div>
      <ul class="level-list" id="levelList"></ul>
      <div class="sidebar-note" id="sidebarNote"></div>
      <div class="data-tools">
        <div class="data-tools-title">进度备份</div>
        <div class="data-tools-desc">换浏览器或重新打开时，可用备份文件找回进度</div>
        <div class="data-tools-btns">
          <button type="button" id="exportBtn">导出备份</button>
          <button type="button" id="importBtn">导入备份</button>
        </div>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main">
      <div class="welcome-banner" id="welcomeBanner" hidden></div>

      <div class="level-card">
        <div class="level-heading">
          <div class="level-badge" id="levelBadge">1</div>
          <div class="level-heading-text">
            <h2 id="levelTitle"></h2>
            <p id="levelSubtitle"></p>
          </div>
          <div class="level-status" id="levelStatus"></div>
        </div>

        <div class="tabs" id="tabs">
          <button type="button" data-tab="intro" class="active"><span class="tab-num">1</span>引入</button>
          <button type="button" data-tab="knowledge"><span class="tab-num">2</span>知识点</button>
          <button type="button" data-tab="example"><span class="tab-num">3</span>示例</button>
          <button type="button" data-tab="task"><span class="tab-num">4</span>任务</button>
          <button type="button" data-tab="check"><span class="tab-num">5</span>检测</button>
        </div>

        <div class="tab-panel" id="tabPanel"></div>

        <!-- 动手区 -->
        <section class="practice">
          <div class="practice-head">
            <h3>动手做一做</h3>
            <span class="practice-tip">写出来、跑一跑，电脑会告诉你结果</span>
          </div>

          <div class="stdin-row" id="stdinRow" hidden>
            <label for="stdinInput" id="stdinLabel">程序向你提问时，你回答：</label>
            <textarea id="stdinInput" rows="2" spellcheck="false" autocomplete="off" placeholder="每行写一个回答"></textarea>
          </div>

          <div class="editor-wrap">
            <div class="line-numbers" id="lineNumbers">1</div>
            <textarea id="codeEditor" spellcheck="false" wrap="off" placeholder="在这里写下你的代码……"></textarea>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-ghost" id="hintBtn">给点提示</button>
            <button type="button" class="btn btn-secondary" id="runBtn">运行看看</button>
            <button type="button" class="btn btn-primary" id="submitBtn">提交闯关</button>
          </div>

          <div class="hint-box" id="hintBox" hidden>
            <div class="hint-title">小线索</div>
            <div id="hintText"></div>
            <button type="button" class="hint-more" id="hintMore" hidden>再给一点</button>
          </div>

          <div class="output-box">
            <div class="output-title"><span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span> 电脑的输出</div>
            <pre id="output">（还没有运行，先点「运行看看」吧）</pre>
          </div>

          <div class="feedback" id="feedback" hidden></div>
        </section>

        <!-- 小检测 -->
        <section class="quiz" id="quiz" hidden>
          <div class="quiz-head"><span class="quiz-tag">小检测</span><h3 id="quizQuestion"></h3></div>
          <div class="quiz-options" id="quizOptions"></div>
          <div class="feedback" id="quizFeedback" hidden></div>
          <p class="quiz-note">通过小检测，就能解锁下一关啦</p>
        </section>
      </div>
    </main>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" hidden></div>

  <!-- 通关弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modalCancel">再看看</button>
        <button type="button" class="btn btn-primary" id="modalOk">开启下一关</button>
      </div>
    </div>
  </div>

</div>

<script src="interpreter.js"></script>
<script src="levels.js"></script>
<script src="app.js"></script>
</body>
</html>
